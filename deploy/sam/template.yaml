AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: hakigains — scheduled briefing + Telegram webhook (ap-southeast-1)

Parameters:
  SecretName:
    Type: String
    Description: Secrets Manager secret holding GARMIN_* and TELEGRAM_* keys.
  TelegramChatId:
    Type: String
    Description: The owner's Telegram chat ID (the bot's allowlist).
  BriefingCron:
    Type: String
    Default: "cron(0 23 * * ? *)"   # 07:00 SGT (UTC+8) daily
    Description: EventBridge schedule expression (UTC) for the morning briefing.
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-5-5
    Description: Bedrock inference profile for the coaching call.
  BedrockFallbackModelId:
    Type: String
    Default: global.anthropic.claude-opus-4-8
    Description: Retried once if the primary model refuses.
  Timezone:
    Type: String
    Default: Asia/Singapore
    Description: The athlete's timezone — decides which date counts as "today" (Lambda itself runs in UTC).

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Environment:
      Variables:
        HAKIGAINS_SECRET_NAME: !Ref SecretName
        HAKIGAINS_STATE_BUCKET: !Ref StateBucket
        HAKIGAINS_CONFIG: /var/task/config.yaml
        HAKIGAINS_TOKEN_PATH: /tmp/garth_token
        HAKIGAINS_DATA_DIR: /tmp/hakigains-data
        TELEGRAM_CHAT_ID: !Ref TelegramChatId
        LLM_PROVIDER: bedrock
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
        HAKIGAINS_TZ: !Ref Timezone
        HAKIGAINS_MEMORY_ID: !GetAtt CoachMemory.MemoryId

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Coach memory: chat turns are stored as events; AgentCore extracts dated facts
  # from them in the background, and the coach searches those before each reply.
  CoachMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: hakigains
      Description: hakigains coach memory - chat turns plus facts extracted from them.
      EventExpiryDuration: 90     # days raw chat turns are kept; extracted facts persist
      MemoryStrategies:
        - SemanticMemoryStrategy:
            Name: Facts
            NamespaceTemplates:
              - "/athlete/{actorId}/facts/"

  ScheduledBriefingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: deploy/lambda/Dockerfile
      DockerContext: ../..        # repo root, so COPY src/ etc. resolve
      DockerTag: briefing
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handler.scheduled_briefing"]
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*" }
        - S3CrudPolicy: { BucketName: !Ref StateBucket }
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Global inference profiles route to any region, hence the wildcards.
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-*"
                - "arn:aws:bedrock:::foundation-model/anthropic.claude-*"
            - Effect: Allow
              Action:
                - bedrock-agentcore:CreateEvent
                - bedrock-agentcore:ListEvents
                - bedrock-agentcore:RetrieveMemoryRecords
                - bedrock-agentcore:ListMemoryRecords
                - bedrock-agentcore:DeleteMemoryRecord
              Resource: !GetAtt CoachMemory.MemoryArn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: !Ref BriefingCron

  WebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: deploy/lambda/Dockerfile
      DockerContext: ../..
      DockerTag: webhook
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handler.telegram_webhook"]
      FunctionUrlConfig:
        AuthType: NONE            # Telegram posts here; the chat-ID gate is the guard
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}*" }
        - S3CrudPolicy: { BucketName: !Ref StateBucket }
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                # Global inference profiles route to any region, hence the wildcards.
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-*"
                - "arn:aws:bedrock:::foundation-model/anthropic.claude-*"
            - Effect: Allow
              Action:
                - bedrock-agentcore:CreateEvent
                - bedrock-agentcore:ListEvents
                - bedrock-agentcore:RetrieveMemoryRecords
                - bedrock-agentcore:ListMemoryRecords
                - bedrock-agentcore:DeleteMemoryRecord
              Resource: !GetAtt CoachMemory.MemoryArn

Outputs:
  WebhookUrl:
    Description: Set this as the Telegram webhook (see DEPLOY.md).
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  StateBucketName:
    Value: !Ref StateBucket
  CoachMemoryId:
    Description: AgentCore Memory id (set as HAKIGAINS_MEMORY_ID to use it from a local run).
    Value: !GetAtt CoachMemory.MemoryId
