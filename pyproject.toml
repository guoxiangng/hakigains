[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hakigains"
version = "0.1.0"
description = "An AI training coach over Garmin data, delivered via Telegram."
requires-python = ">=3.11"
dependencies = [
    "garminconnect",
    "anthropic[bedrock]",
    "requests",
    "python-dotenv",
    "PyYAML",
]

[project.optional-dependencies]
azure = ["openai"]  # legacy Azure OpenAI provider

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hakigains = ["py.typed"]
